; Going Catch You - passo 1 (so observa, nao altera nada no jogo)
; Copie este ficheiro para Data\SKSE\Plugins\ ao lado da GoingCatchYou.dll.
; Sem ele, valem os valores abaixo.

[General]
; 0 = o plugin nao instala nada
bEnabled=1

; De quantos em quantos milissegundos o mundo e observado
iSampleMs=500

; So NPCs a esta distancia do jogador (unidades do jogo; 70 unidades ~ 1 metro)
fRadius=3000

; 0 = so NPCs vivos com arma desembainhada (o que se aproxima de "em combate")
; 1 = todos os NPCs proximos (para comparar no log)
bAllActors=0

; De quantos em quantos milissegundos cada NPC observado ganha uma linha "track"
iStatusMs=2000

; Um NPC conta como "parado" se a sua PROPRIA velocidade (calculada a partir das posicoes dele) for menor do que isto (unidades por segundo)...
fStoppedSpeed=30
; ...durante pelo menos isto (milissegundos)...
iStallMs=2000
; ...e estiver mais longe do jogador do que isto (unidades)
fStallMinDistance=400

; O maximo de NPCs observados ao mesmo tempo
iMaxTracks=12
