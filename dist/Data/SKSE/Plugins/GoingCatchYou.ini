; Going Catch You - versao 0.4.0 (SO LE, nao altera nada no jogo: o salto e as teclas de teste vem desligados)
; Copie este ficheiro para Data\SKSE\Plugins\ ao lado da GoingCatchYou.dll.
; Sem ele, valem os valores abaixo.

[General]
; 0 = o plugin nao instala nada
bEnabled=1

; De quantos em quantos milissegundos o mundo e observado
iSampleMs=500

; So NPCs a esta distancia do jogador (unidades do jogo; 70 unidades ~ 1 metro)
fRadius=3000

; Quem e observado: os NPCs EM COMBATE segundo o proprio motor (pessoas, criaturas, cavalos).
; 1 = observar tambem quem so tem a arma desembainhada (o criterio antigo)
bIncludeWeaponDrawn=0
; 1 = observar todos os NPCs proximos (para comparar no log)
bAllActors=0

; De quantos em quantos milissegundos cada NPC observado ganha uma linha "track"
iStatusMs=2000

; Um NPC conta como "parado" se a sua PROPRIA velocidade (calculada a partir das posicoes dele)
; for menor do que isto (unidades por segundo)...
fStoppedSpeed=30
; ...durante pelo menos isto (milissegundos)...
iStallMs=2000
; ...e estiver mais longe do jogador do que isto (unidades). Arqueiros ficam de fora.
fStallMinDistance=400

; Quanto tempo (ms) um NPC que deixa de qualificar e mantido antes de ser dado como "saiu"
iKeepMs=5000

; Leitura do mundo em volta de um caçador parado: altura do obstaculo, queda do chao a frente,
; linha de visao para o jogador. Nao altera nada.
bCast=1
iCastMs=1000
fCastDistance=300

; Compara NPCs em combate com NPCs que nao estao em combate, campo a campo. Ja serviu para achar o
; alvo de combate (actor+0x90); fica desligada porque custa tempo.
bProbe=0
iProbeMs=4000
iSummaryMs=30000

; ---------------------------------------------------------------- EXPLORADOR (novo na 0.4.0)
; Descobre como a IA de movimento e de combate de um NPC esta organizada na memoria: da nome a cada
; objeto pelo RTTI do executavel, procura sequencias de posicoes que possam ser um caminho, e regista
; que campos mudam quando o NPC anda, para ou se afasta do jogador. So le.
bExplore=1
; De quantos em quantos ms cada caçador e explorado
iExploreMs=3000
; Quantos objetos, no maximo, numa exploracao, e a que profundidade de ponteiros
iExploreMaxObjects=300
iExploreDepth=5

; Shift + esta tecla despeja no log o estado completo de todos os caçadores perto e do jogador.
; 45 = Insert (codigo de tecla virtual do Windows, em decimal)
iKeyDump=45
bDumpNeedsShift=1

; ---------------------------------------------------------------- SALTO (desligado nesta versao)
; Um caçador (em combate, com o jogador como alvo) que fica parado no chao, com o jogador a
; mais de fJumpMinPlayerDistance, e com um obstaculo BAIXO mesmo a frente, e posto a saltar por cima dele.
; O salto nao e fisico: a fisica do NPC e desligada, ele e movido num arco curto frame a frame
; e a fisica volta onde ele aterra.

; 0 = desliga o salto (o plugin volta a so observar)
bJump=0
; 1 = planeia e escreve no log o que faria, mas nao faz nada
bJumpDryRun=0

; O obstaculo mais alto que ele salta (unidades; 70 ~ 1 metro, a altura da cintura). Maximo 110.
fJumpMaxObstacle=110
; O obstaculo tem de estar a esta distancia do NPC, no maximo
fJumpTriggerDistance=120
; Um caçador mais perto do jogador do que isto nao salta (esta a atacar)
fJumpMinPlayerDistance=200
; Quanto tempo (ms) tem de estar parado antes de saltar...
iJumpStopMs=1200

; ...ou, em alternativa, o DESVIO: o caçador anda (mais depressa do que fDetourMinSpeed) mas com o
; rumo a mais de fDetourAngle graus da linha reta para o jogador, durante iDetourMs. E o que ele faz
; quando da a volta em vez de ir direto; se houver um obstaculo saltavel nessa linha, salta.
iDetourMs=2000
fDetourMinSpeed=90
fDetourAngle=60
; Intervalo minimo (ms) entre duas tentativas para o mesmo NPC
iJumpCooldownMs=4000

; Eventos de animacao de salto do jogo, enviados ao NPC no inicio e no fim do salto. Se o jogo nao os
; aceitar, o log diz "not accepted" e o NPC desliza em pose de corrida. 0 = nao enviar.
bJumpAnimation=1
sJumpStartEvent=JumpDirectionalStart
sJumpEndEvent=JumpLand

; ---------------------------------------------------------------- TECLAS DE TESTE
; Atuam sobre o NPC em combate mais perto do jogador (um caçador, de preferencia), SEM as
; condicoes do salto automatico. Os numeros sao codigos de tecla virtual do Windows, em decimal
; (38 = seta para cima, 40 = seta para baixo). So funcionam com a janela do jogo em primeiro plano.
; Nao as uses com a consola ou um menu abertos.
bManualKeys=0
; Seta para cima: o arco do plugin (sobre um obstaculo se houver, senao um salto simples de 160 unidades)
iKeyHopArc=38
; Seta para baixo: a animacao de vault do FreeRun (o NPC tem de estar a menos de 110 unidades de um
; obstaculo entre 42 e 120 de altura, virado para ele, e o behavior do FreeRun tem de estar no grafo dele)
iKeyHopFreeRun=40
; Distancia maxima do NPC ao jogador para as teclas de teste
fManualRange=2500

; O maximo de NPCs observados ao mesmo tempo
iMaxTracks=12
