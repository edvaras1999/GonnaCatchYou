; Going Catch You - versao 0.5.0 (ALTERA O JOGO: caçadores que nao se aproximam de ti saltam na tua direcao)
; Copie este ficheiro para Data\SKSE\Plugins\ ao lado da GoingCatchYou.dll.
; Sem ele, valem os valores abaixo.

[General]
; 0 = o plugin nao instala nada
bEnabled=1

; ---------------------------------------------------------------- OBSERVACAO
; De quantos em quantos milissegundos o mundo e observado
iSampleMs=500
; So NPCs a esta distancia do jogador (unidades do jogo; 70 unidades ~ 1 metro)
fRadius=3000
; Quem e observado: os NPCs EM COMBATE segundo o proprio motor.
bIncludeWeaponDrawn=0
bAllActors=0
; De quantos em quantos milissegundos cada NPC observado ganha uma linha "track"
iStatusMs=2000
; Um NPC conta como "parado" se a sua velocidade (calculada pelas posicoes) for menor do que isto (u/s)...
fStoppedSpeed=30
; ...durante pelo menos isto (ms), e estiver mais longe do jogador do que isto (unidades)
iStallMs=2000
fStallMinDistance=400
; Quanto tempo (ms) um NPC que deixa de qualificar e mantido antes de ser dado como "saiu"
iKeepMs=5000
; Leitura do mundo em volta de um caçador parado (obstaculo, queda, linha de visao)
bCast=1
iCastMs=1000
fCastDistance=300
; O maximo de NPCs observados ao mesmo tempo
iMaxTracks=12

; ---------------------------------------------------------------- SALTO (A PERSEGUICAO)
; Um caçador (em combate, com o jogador como alvo) que NAO SE APROXIMA e posto a saltar na tua direcao:
; num arco balistico para uma aterragem segura perto de ti. A cada frame o plugin poe o NPC onde o arco diz,
; marca-o "no ar" (para o jogo tocar a pose de queda), da-lhe a velocidade do arco e mantem a altura de
; inicio de queda no sitio, para nao haver dano na aterragem. Depois e vigiado, e se tiver atravessado o
; chao e posto de volta onde estava.
;
; 0 = desliga o salto (so observa)
bJump=1
; 1 = planeia e escreve no log o que faria, mas nao faz nada
bJumpDryRun=0

; Quando se aproxima: o caçador esta parado ha iLeapStallMs (e, com bLeapNeedSight=1, ve o jogador),
; OU anda ha iDetourMs com o rumo a mais de fDetourAngle graus da linha reta para o jogador.
iLeapStallMs=1500
bLeapNeedSight=1
iDetourMs=2000
fDetourMinSpeed=90
fDetourAngle=60
; Um caçador mais perto do jogador do que isto nao salta (esta a atacar)
fJumpMinPlayerDistance=220
; Intervalo minimo (ms) entre duas tentativas para o mesmo NPC
iJumpCooldownMs=3500

; O arco: o salto mais longo, o que sobe e o que desce no maximo (unidades), a gravidade do arco,
; a velocidade maxima ao longo do salto (unidades/s), e a que distancia do jogador tenta aterrar.
fLeapMaxDistance=520
fLeapMaxRise=180
fLeapMaxDrop=420
fLeapGravity=900
fLeapMaxSpeed=650
fLeapLandNear=140

; Eventos de animacao de salto do jogo, enviados no inicio e no fim. Desligado: a pose de queda vem
; do estado "no ar". 1 = enviar tambem (se o jogo nao os aceitar, o log diz).
bJumpAnimation=0
sJumpStartEvent=JumpFall
sJumpEndEvent=JumpLand

; ---------------------------------------------------------------- TECLAS DE TESTE
; Atuam sobre o NPC em combate mais perto do jogador (um caçador, de preferencia), SEM as condicoes
; acima. Codigos de tecla virtual do Windows, em decimal (38 = seta para cima). So funcionam com a
; janela do jogo em primeiro plano. Nao as uses com a consola ou um menu abertos.
bManualKeys=1
; Seta para cima: faz o salto na tua direcao ja
iKeyHopArc=38
; Seta para baixo (40) = a animacao de vault do FreeRun; 0 = desligada (a animacao sozinha nao leva o NPC)
iKeyHopFreeRun=0
fManualRange=2500

; ---------------------------------------------------------------- EXPLORADOR (desligado)
; Descobriu o mapa das estruturas de movimento e combate, mas e PESADO (ate 1 s num despejo). So le.
bExplore=0
iExploreMs=3000
iExploreMaxObjects=300
iExploreDepth=5
; Shift + esta tecla (45 = Insert) despeja o estado dos caçadores perto
iKeyDump=45
bDumpNeedsShift=1

; ---------------------------------------------------------------- SONDA ANTIGA (desligada)
bProbe=0
iProbeMs=4000
iSummaryMs=30000
